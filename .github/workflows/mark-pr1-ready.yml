name: Mark PR 1 ready

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-pr1-ready.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark extraction PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 1 --repo "$GITHUB_REPOSITORY"
